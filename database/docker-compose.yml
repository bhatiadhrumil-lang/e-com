# Local PostgreSQL for development ONLY.
# This is intentionally database-only: the application itself is not containerized yet.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_secret
      POSTGRES_DB: ecom
    ports:
      - "5432:5432"
    volumes:
      - ecom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecom_pgdata:
